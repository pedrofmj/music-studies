plugins {
    id "com.android.application"
}

def fluidsynthRoot = providers.gradleProperty("fluidsynthRoot").orNull
def androidCatalogAssets = layout.buildDirectory.dir("generated/androidCatalogAssets")
def prepareAndroidCatalogAssets = tasks.register("prepareAndroidCatalogAssets", Copy) {
    from(files(
            rootProject.file("../docs/tools/music-rig/benchmarks/arturia-genre-patches.json"),
            rootProject.file("../docs/tools/music-rig/benchmarks/arturia-shared-sf2-routing.json"),
            rootProject.file("../docs/tools/music-rig/benchmarks/arturia-sf2-assets.android.json")))
    into(androidCatalogAssets)
}

android {
    namespace "org.musicrig.android"
    compileSdk 35
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "org.musicrig.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        if (fluidsynthRoot != null) {
            externalNativeBuild {
                cmake {
                    arguments "-DFLUIDSYNTH_ROOT=${fluidsynthRoot}",
                            "-DANDROID_STL=c++_shared"
                    cppFlags "-std=c++17"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDir(androidCatalogAssets)
            if (fluidsynthRoot != null) {
                jniLibs.srcDir(file("${fluidsynthRoot}/lib"))
            }
        }
    }

    if (fluidsynthRoot != null) {
        externalNativeBuild {
            cmake {
                path file("src/main/cpp/CMakeLists.txt")
                version "3.22.1"
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareAndroidCatalogAssets)
}
