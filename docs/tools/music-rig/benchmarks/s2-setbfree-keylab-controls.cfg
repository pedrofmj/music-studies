# Candidate-only KeyLab Essential 61 mk3 mapping for setBfree.
# Drawbars are inverted by setBfree so the physical faders behave like organ
# drawbars. The remaining controls use verified setBfree MIDI functions.
midi.controller.reset=1

midi.controller.upper.73=upper.drawbar16
midi.controller.upper.75=upper.drawbar513
midi.controller.upper.79=upper.drawbar8
midi.controller.upper.72=upper.drawbar4
midi.controller.upper.80=upper.drawbar223
midi.controller.upper.81=upper.drawbar2
midi.controller.upper.82=upper.drawbar135
midi.controller.upper.83=upper.drawbar113
midi.controller.upper.85=upper.drawbar1

midi.controller.upper.74=percussion.enable
midi.controller.upper.71=percussion.decay
midi.controller.upper.76=overdrive.inputgain
midi.controller.upper.77=vibrato.knob
midi.controller.upper.93=rotary.speed-preset
midi.controller.upper.18=overdrive.outputgain
midi.controller.upper.19=vibrato.routing
midi.controller.upper.16=swellpedal1
midi.controller.upper.17=reverb.mix
