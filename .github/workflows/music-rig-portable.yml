name: Music Rig Portable Core

on:
  push:
    paths:
      - .github/workflows/music-rig-portable.yml
      - .gitattributes
      - docs/tools/music-rig/**
      - src/performance-rigs/**
  pull_request:
    paths:
      - .github/workflows/music-rig-portable.yml
      - .gitattributes
      - docs/tools/music-rig/**
      - src/performance-rigs/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-rig-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            python_executable: bin/python
          - name: Windows MSVC
            os: windows-2025
            python_executable: python.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install profile schema validator
        run: >-
          python -m pip install --disable-pip-version-check
          --requirement docs/tools/music-rig/requirements-schema.txt

      - name: Configure portable core
        run: >-
          cmake -S docs/tools/music-rig -B build/music-rig
          -DCMAKE_BUILD_TYPE=Release
          "-DPython3_EXECUTABLE=${{ env.pythonLocation }}/${{ matrix.python_executable }}"

      - name: Build portable core and tests
        run: cmake --build build/music-rig --config Release

      - name: Run portable contract tests
        run: >-
          ctest --test-dir build/music-rig -C Release
          --output-on-failure

      - name: Configure Windows JSON dependency probe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DISABLE_METRICS: 1
        run: >-
          cmake -S docs/tools/music-rig -B build/music-rig-json-c
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DMUSIC_RIG_ENABLE_JSON_C_SPIKE=ON

      - name: Build Windows JSON dependency probe
        if: runner.os == 'Windows'
        run: cmake --build build/music-rig-json-c --config Release

      - name: Run Windows JSON dependency probe
        if: runner.os == 'Windows'
        run: >-
          ctest --test-dir build/music-rig-json-c -C Release
          --output-on-failure

      - name: Stage Windows reference bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = 'build/music-rig/windows-reference-bundle'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          $sourceFiles = @(
            'build/music-rig/Release/music-rig.exe',
            'build/music-rig/Release/music_rig_protocol_test.exe',
            'build/music-rig/Release/music_rig_windows_generation_adoption_test.exe',
            'build/music-rig/Release/music_rig_windows_ipc_roundtrip_test.exe',
            'build/music-rig/Release/music_rig_windows_resource_measurement_test.exe'
          )
          foreach ($sourceFile in $sourceFiles) {
            Copy-Item -LiteralPath $sourceFile -Destination $bundle
          }
          Copy-Item `
            -LiteralPath 'build/music-rig-json-c/Release/music_rig_json_c_spike.exe' `
            -Destination $bundle
          Copy-Item `
            -LiteralPath 'build/music-rig-json-c/Release/music-rig.exe' `
            -Destination "$bundle/music-rig-json-c-baseline.exe"
          Copy-Item `
            -LiteralPath 'build/music-rig-json-c/Release/music_rig_shadow_idle_workload.exe' `
            -Destination $bundle
          Copy-Item `
            -LiteralPath 'docs/tools/music-rig/tests/fixtures/compiled-runtime-minimal.json' `
            -Destination $bundle
          Copy-Item `
            -LiteralPath 'docs/tools/music-rig/tests/fixtures/compiled-current-envelope.json' `
            -Destination $bundle
          Copy-Item `
            -LiteralPath 'docs/tools/music-rig/benchmarks/measure-shadow-idle-windows.ps1' `
            -Destination $bundle
          $jsonLibraries = @(
            Get-ChildItem `
              -LiteralPath 'build/music-rig-json-c/vcpkg_installed/x64-windows-static-md/lib' `
              -Filter '*json-c*.lib' `
              -File
          )
          if ($jsonLibraries.Count -ne 1) {
            throw "Expected one static json-c library, found $($jsonLibraries.Count)"
          }
          Copy-Item `
            -LiteralPath $jsonLibraries[0].FullName `
            -Destination "$bundle/json-c-static.lib"
          Copy-Item `
            -LiteralPath 'build/music-rig-json-c/vcpkg_installed/x64-windows-static-md/share/json-c/copyright' `
            -Destination "$bundle/json-c-LICENSE.txt"
          $vcpkgVersion = (
            & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" version |
              Select-Object -First 1
          ).Trim()
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundle -File | ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
              [ordered]@{
                name = $_.Name
                bytes = $_.Length
                sha256 = $hash.Hash.ToLowerInvariant()
              }
            }
          )
          [ordered]@{
            schema = 'music-studies/windows-reference-bundle/v1'
            commit = $env:GITHUB_SHA
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            vcpkg_version = $vcpkgVersion
            vcpkg_baseline = '56bb2411609227288b70117ead2c47585ba07713'
            vcpkg_triplet = 'x64-windows-static-md'
            json_c_port_version = '0.18-20240915'
            created_at = (Get-Date).ToUniversalTime().ToString('o')
            artifacts = $artifacts
          } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM -LiteralPath "$bundle/manifest.json"

      - name: Upload Windows reference bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: music-rig-windows-reference-${{ github.sha }}
          path: build/music-rig/windows-reference-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
